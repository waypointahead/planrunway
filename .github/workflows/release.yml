name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag
        required: true
        type: string
      candidate_sha256:
        description: SHA-256 validated before milestone acceptance
        required: true
        type: string
      candidate_exec_sha256:
        description: Exec wheel SHA-256 validated before milestone acceptance
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - run: git tag --points-at HEAD | grep -Fx "${{ inputs.tag }}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pip install -e .
      - run: python -m pip install -e packages/planrunway-exec
      - run: python tools/release/validate_public_surface.py .
      - run: pytest --import-mode=importlib tests packages/planrunway-exec/tests tools/release/tests
      - run: python tools/release/build_core_artifacts.py --output dist --expected-sha256 "${{ inputs.candidate_sha256 }}" --exec-version 0.1.0 --expected-exec-sha256 "${{ inputs.candidate_exec_sha256 }}"
      - run: python -m venv /tmp/planrunway-venv
      - run: /tmp/planrunway-venv/bin/pip install dist/planrunway-*.whl dist/planrunway_exec-*.whl
      - run: mkdir /tmp/planrunway-project
      - run: /tmp/planrunway-venv/bin/planrunway init --root /tmp/planrunway-project
      - run: /tmp/planrunway-venv/bin/planrunway migrate --yes --root /tmp/planrunway-project
      - run: /tmp/planrunway-venv/bin/planrunway lint --root /tmp/planrunway-project
      - run: /tmp/planrunway-venv/bin/planrunway-exec --version
      - run: PATH=/tmp/planrunway-venv/bin:$PATH /tmp/planrunway-venv/bin/planrunway config-reconfigure --tier controlled-exec --yes --root /tmp/planrunway-project
      - run: /tmp/planrunway-project/.prway/system/bin/planrunway status --root /tmp/planrunway-project
      - run: gh release create "${{ inputs.tag }}" dist/* --verify-tag --title "${{ inputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
