name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag
        required: true
        type: string
      candidate_sha256:
        description: SHA-256 validated before milestone acceptance
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: python -m pip install -e .
      - run: python tools/release/validate_public_surface.py .
      - run: pytest tests tools/release/tests
      - run: python tools/release/build_core_artifacts.py --output dist --expected-sha256 "${{ inputs.candidate_sha256 }}"
      - run: python -m venv /tmp/planrunway-venv
      - run: /tmp/planrunway-venv/bin/pip install dist/planrunway-*.whl
      - run: mkdir /tmp/planrunway-project
      - run: /tmp/planrunway-venv/bin/planrunway init --root /tmp/planrunway-project
      - run: /tmp/planrunway-project/.prway/system/bin/planrunway status --root /tmp/planrunway-project
      - run: gh release create "${{ inputs.tag }}" dist/* --title "${{ inputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
