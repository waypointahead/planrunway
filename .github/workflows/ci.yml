name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pip install -e .
      - run: python tools/release/validate_public_surface.py .
      - run: pytest tests tools/release/tests
      - run: python tools/release/build_core_artifacts.py --output dist
      - run: python -m venv /tmp/planrunway-venv
      - run: /tmp/planrunway-venv/bin/pip install dist/planrunway-*.whl
      - run: mkdir /tmp/planrunway-project
      - run: /tmp/planrunway-venv/bin/planrunway init --root /tmp/planrunway-project
      - run: /tmp/planrunway-project/.prway/system/bin/planrunway status --root /tmp/planrunway-project
